# Sert l'application Angular ; les appels API partent du navigateur vers la Gateway.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Routage Angular : toute URL inconnue renvoie index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers versionnés par le build (hash dans le nom) : cache long.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html ne doit jamais être mis en cache (sinon ancienne version servie).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
