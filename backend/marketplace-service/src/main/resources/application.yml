spring:
  application:
    name: marketplace-service
  datasource:
    url: ${MARKETPLACE_DB_URL:jdbc:mysql://localhost:3306/mecanico_marketplace_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MARKETPLACE_DB_USERNAME:root}
    password: ${MARKETPLACE_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
