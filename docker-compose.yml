# =============================================================================
# Mecanico - plateforme microservices (module MT-41 · Applications Web Distribuées)
# -----------------------------------------------------------------------------
# Configuration : cp .env.example .env   (facultatif, des valeurs par défaut existent)
#
# Profils :
#   (aucun)    infrastructure commune : MySQL, MongoDB, RabbitMQ, Keycloak,
#              Eureka, API Gateway
#   ms1 / ms3  infrastructure + le microservice choisi
#   front      Front-end Angular servi par nginx
#   all        toute la plateforme (démo / soutenance)
#
#   docker compose up -d                              # infra seule (dev dans l'IDE)
#   docker compose --profile ms1 up -d --build        # infra + MS1
#   docker compose --profile all up -d --build        # tout
#   docker compose ps                                 # état + santé
#   docker compose --profile all down                 # arrêt (données conservées)
#   docker compose --profile all down -v              # arrêt + remise à zéro des bases
#
# Ports exposés sur la machine hôte (modifiables dans .env) :
#   8084 API Gateway (point d'entrée unique)   8761 Eureka
#   8180 Keycloak (console admin)              15672 RabbitMQ (interface web)
#   3307 MySQL                                 27017 MongoDB
#   8081 MS3 Marketplace   8082 MS1 Vehicle Passport   4201 Front-end
# =============================================================================
name: mecanico

# ----------------------------------------------------------------- blocs communs
# Variables injectées dans chaque conteneur Spring Boot.
x-spring-env: &spring-env
  TZ: ${TZ:-Africa/Tunis}
  EUREKA_URL: http://eureka-server:8761/eureka/
  # Les jetons portent iss=http://localhost:<port>/realms/mecanico (URL vue par le
  # navigateur) ; les clés de signature sont lues via le réseau Docker.
  KEYCLOAK_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-8180}/realms/mecanico
  KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/mecanico/protocol/openid-connect/certs
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: ${RABBITMQ_USER:-guest}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
  JAVA_OPTS: -XX:MaxRAMPercentage=75 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Duser.timezone=${TZ:-Africa/Tunis}

# Santé d'un service Spring Boot : GET /actuator/health doit répondre 200.
# Utilise bash (/dev/tcp) pour ne pas dépendre de curl dans l'image.
x-spring-healthcheck: &spring-healthcheck
  test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/$${SERVER_PORT} && printf 'GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
  interval: 15s
  timeout: 5s
  retries: 10
  start_period: 60s

# Dépendances d'un microservice métier : il ne démarre que lorsque l'infra est prête.
x-service-depends: &service-depends
  mysql:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy
  eureka-server:
    condition: service_healthy

x-spring-service: &spring-service
  restart: unless-stopped
  mem_limit: ${MEM_SPRING_SERVICE:-512m}
  healthcheck: *spring-healthcheck
  depends_on: *service-depends

services:
  # =========================================================== infrastructure
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: ${MEM_MYSQL:-768m}
    environment:
      TZ: ${TZ:-Africa/Tunis}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      # Utilisateur applicatif créé au premier démarrage ; il reçoit les droits
      # sur toutes les bases "mecanico_*" (voir infra/mysql/init).
      MYSQL_USER: ${DB_USER:-mecanico}
      MYSQL_PASSWORD: ${DB_PASSWORD:-mecanico}
    command: ["--performance-schema=OFF", "--innodb-buffer-pool-size=128M"]
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  mongodb:
    image: mongo:7
    restart: unless-stopped
    mem_limit: ${MEM_MONGO:-512m}
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    environment:
      TZ: ${TZ:-Africa/Tunis}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    mem_limit: ${MEM_RABBITMQ:-384m}
    environment:
      TZ: ${TZ:-Africa/Tunis}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    # Mode dev : le realm est réimporté depuis infra/keycloak à chaque démarrage
    # à vide ; le fichier mecanico-realm.json est la source de vérité.
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    mem_limit: ${MEM_KEYCLOAK:-1g}
    environment:
      TZ: ${TZ:-Africa/Tunis}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Les jetons portent toujours iss=http://localhost:<port>/realms/mecanico, alors
      # que les services récupèrent les clés via le réseau Docker (keycloak:8080).
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=70
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # Port de management 9000 (pas de curl dans l'image).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  eureka-server:
    build: ./Backend/eureka-server
    restart: unless-stopped
    mem_limit: ${MEM_SPRING_INFRA:-384m}
    environment:
      <<: *spring-env
      SERVER_PORT: 8761
    ports:
      - "${EUREKA_PORT:-8761}:8761"
    healthcheck: *spring-healthcheck

  api-gateway:
    build: ./Backend/api-gateway
    restart: unless-stopped
    mem_limit: ${MEM_SPRING_INFRA:-384m}
    environment:
      <<: *spring-env
      SERVER_PORT: 8084
    ports:
      - "${GATEWAY_PORT:-8084}:8084"
    # Permet de router vers un microservice lancé dans l'IDE (hors Docker) qui
    # s'enregistre dans Eureka sous le nom host.docker.internal (voir CONTRIBUTING).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck: *spring-healthcheck
    depends_on:
      eureka-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # ============================================================ microservices
  # Chaque microservice a son profil "msN" + le profil "all".

  # MS1 - Vehicle Passport (MySQL : mecanico_vehicle_passport_db)
  vehicle-passport-service:
    <<: *spring-service
    profiles: ["ms1", "all"]
    build: ./Backend/vehicle-passport-service
    environment:
      <<: *spring-env
      SERVER_PORT: 8082
      DB_URL: jdbc:mysql://mysql:3306/mecanico_vehicle_passport_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Tunis&characterEncoding=UTF-8
      DB_USER: ${DB_USER:-mecanico}
      DB_PASSWORD: ${DB_PASSWORD:-mecanico}
    ports:
      - "${PASSPORT_PORT:-8082}:8082"

  # MS3 - Parts Marketplace (MySQL : mecanico_marketplace_db)
  marketplace-service:
    <<: *spring-service
    profiles: ["ms3", "all"]
    build: ./Backend/marketplace-service
    environment:
      <<: *spring-env
      SERVER_PORT: 8081
      MARKETPLACE_DB_URL: jdbc:mysql://mysql:3306/mecanico_marketplace_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MARKETPLACE_DB_USERNAME: ${DB_USER:-mecanico}
      MARKETPLACE_DB_PASSWORD: ${DB_PASSWORD:-mecanico}
    ports:
      - "${MARKETPLACE_PORT:-8081}:8081"

  # ---------------------------------------------------------------------------
  # MODÈLE - ajouter son microservice (copier, décommenter, remplacer les <...>)
  # Checklist complète : CONTRIBUTING.md, section « Infrastructure Docker ».
  #
  # <nom>-service:
  #   <<: *spring-service
  #   profiles: ["ms<N>", "all"]
  #   build: ./Backend/<nom>-service
  #   environment:
  #     <<: *spring-env
  #     SERVER_PORT: <port>
  #     # MySQL : la base mecanico_<nom>_db est accessible à DB_USER (droits mecanico_*)
  #     DB_URL: jdbc:mysql://mysql:3306/mecanico_<nom>_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
  #     DB_USER: ${DB_USER:-mecanico}
  #     DB_PASSWORD: ${DB_PASSWORD:-mecanico}
  #     # MongoDB (MS5) : remplacer les 3 lignes DB_* par
  #     # MONGODB_URI: mongodb://mongodb:27017/mecanico_<nom>_db
  #     # H2 : aucune variable de base à ajouter.
  #   ports:
  #     - "${<NOM>_PORT:-<port>}:<port>"
  #   # MS5 sur MongoDB : décommenter pour attendre MongoDB en plus du socle.
  #   # depends_on:
  #   #   <<: *service-depends
  #   #   mongodb:
  #   #     condition: service_healthy
  # ---------------------------------------------------------------------------

  # ================================================================ front-end
  frontend:
    profiles: ["front", "all"]
    build: ./Frontend
    restart: unless-stopped
    mem_limit: ${MEM_FRONTEND:-64m}
    ports:
      # 4201 : seule origine autorisée côté Keycloak / CORS pour ce portail.
      - "${FRONTEND_PORT:-4201}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  mysql-data:
  mongo-data:
  rabbitmq-data:
