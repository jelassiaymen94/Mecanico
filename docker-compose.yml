services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mecanico}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mecanico}
      POSTGRES_DB: ${POSTGRES_DB:-mecanico}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mecanico}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: http://localhost:8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-mecanico}:${POSTGRES_PASSWORD:-mecanico}@db:5432/${POSTGRES_DB:-mecanico}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000/api
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db-data:
