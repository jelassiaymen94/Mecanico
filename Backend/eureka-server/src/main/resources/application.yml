server:
  port: 8761

spring:
  application:
    name: mecanico-eureka-server

eureka:
  client:
    # Standalone registry: it does not register with itself.
    register-with-eureka: false
    fetch-registry: false
  server:
    # Faster feedback while developing locally.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
