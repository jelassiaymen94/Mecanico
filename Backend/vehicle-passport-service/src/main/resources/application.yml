server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: mecanico-vehicle-passport-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mecanico_vehicle_passport_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Tunis&characterEncoding=UTF-8}
    username: ${DB_USER:mecanico}
    password: ${DB_PASSWORD:mecanico}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Africa/Tunis
        format_sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/mecanico}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/mecanico/protocol/openid-connect/certs}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
        default-requeue-rejected: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

mecanico:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:4201,http://127.0.0.1:4200,http://127.0.0.1:4201}
  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}
    document-scan-cron: ${DOCUMENT_SCAN_CRON:0 0 8 * * *}
  seed:
    enabled: ${SEED_DEMO_DATA:true}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.mecanico.vehiclepassport: INFO
    org.hibernate.SQL: WARN
