server:
  port: 8082

spring:
  application:
    name: mecanico-vehicle-passport-service
  datasource:
    url: jdbc:mysql://localhost:3306/mecanico_vehicle_passport_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Tunis&characterEncoding=UTF-8
    username: ${DB_USER:mecanico}
    password: ${DB_PASSWORD:mecanico}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Africa/Tunis
        format_sql: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

mecanico:
  security:
    jwt:
      # Must be the same secret as mecanico-user-service.
      secret: ${JWT_SECRET:mecanico-dev-secret-key-change-me-please-0123456789-abcdef}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:4201,http://127.0.0.1:4200,http://127.0.0.1:4201}
  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}
    document-scan-cron: ${DOCUMENT_SCAN_CRON:0 0 8 * * *}
  seed:
    enabled: ${SEED_DEMO_DATA:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.mecanico.vehiclepassport: INFO
    org.hibernate.SQL: WARN
